<!DOCTYPE html>
<html>
  <head>
    <title>Redirecting...</title>
    <script>
      // Parse Supabase's hash params
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);

      // Grab the access token (required for reset password)
      const accessToken = params.get("access_token");

      if (accessToken) {
        // Redirect into the app with the token
        window.location.href = `hisworks://reset-password?access_token=${accessToken}`;
      } else {
        document.body.innerHTML = "<p>Error: No access token found.</p>";
      }
    </script>
  </head>
  <body>
    <p>Redirecting you back to the app...</p>
  </body>
</html>
