<!DOCTYPE html>
<html>
  <head>
    <title>Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Extract ?token=... from the URL
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      if (!token) {
        document.addEventListener("DOMContentLoaded", () => {
          document.body.innerHTML =
            "<p>Error: Password reset token not found.</p>";
        });
      } else {
        // Try redirecting into the mobile app
        const deepLink = `hisworks://reset-password?token=${token}`;

        // Attempt to open the app
        window.location.href = deepLink;

        // Optional fallback after 1 second: show a message or redirect to a web UI
        setTimeout(() => {
          // If app is not installed, show a fallback message
          document.body.innerHTML = `
            <h2>Reset Your Password</h2>
            <p>It looks like the HisWorks app didn't open automatically.</p>
            <p>You can reset your password inside the app.</p>
            <p>Your reset token is:</p>
            <code>${token}</code>
            <p>If you're on mobile, <a href="${deepLink}">tap here</a> to try again.</p>
          `;
        }, 800);
      }
    </script>
  </head>
  <body>
    <p>Redirecting you to the HisWorks app...</p>
  </body>
</html>
