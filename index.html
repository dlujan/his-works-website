<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HisWorks</title>

    <script>
      const hash = window.location.hash;

      const isSupabaseAuthRedirect =
        hash.includes("access_token=") ||
        hash.includes("error=") ||
        hash.includes("error_code=");

      if (isSupabaseAuthRedirect) {
        window.location.replace(`hisworks://confirm-email${hash}`);
      }
    </script>
  </head>

  <body>
    <p id="auth-message" hidden>Redirecting you back to the HisWorks app…</p>

    <script>
      if (
        window.location.hash.includes("access_token=") ||
        window.location.hash.includes("error=") ||
        window.location.hash.includes("error_code=")
      ) {
        document.getElementById("auth-message").hidden = false;
      }
    </script>

    <!-- Your normal homepage content stays here -->
    <h1>HisWorks</h1>
  </body>
</html>
